version: 2

updates:
  - directory: /
    open-pull-requests-limit: 15
    package-ecosystem: npm
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    schedule:
      interval: weekly
  - directory: /.github/workflows
    open-pull-requests-limit: 10
    package-ecosystem: github-actions
    schedule:
      interval: weekly
